blueprint:
  name: Capture Camera Snapshot or Record Video
  author: luuquangvu
  source_url: https://github.com/luuquangvu/tutorials/blob/dev/camera_snapshot_full_llm.yaml
  description: |-
    # Tool for capturing camera snapshots or recording videos used for Voice Assistant

    ## Blueprint Setup

    ### Required

    - A template sensor stores all information about entity aliases needs to be configured in `config/configuration.yaml`; The sensor is required for friendly-name lookup.

    ```
    # File configuration.yaml
    shell_command:
      get_entity_alias: >-
        jq '[.data.entities[] | select(.options.conversation.should_expose == true) | {entity_id, aliases: (if has("aliases_v2") then ((if (.aliases_v2 | type) == "array" then .aliases_v2 else [] end) | map(select(. != null and . != ""))) else (if (.aliases | type) == "array" then .aliases else [] end) end)} | select(.aliases | length > 0)]' ./.storage/core.entity_registry
    template:
      - triggers:
          - trigger: homeassistant
            event: start
          - trigger: event
            event_type: event_template_reloaded
        actions:
          - action: shell_command.get_entity_alias
            response_variable: response
        sensor:
          - name: "Assist: Entity IDs and Aliases"
            unique_id: entity_ids_and_aliases
            icon: mdi:format-list-bulleted
            device_class: timestamp
            state: "{{ now().isoformat() }}"
            attributes:
              entities: "{{ response.stdout }}"
    ```

    - Ensure the directory defined in the capture settings exists (default is `/media`).

    ### Optional

    - Adjust the prompts for each field used in the script. The descriptions guide the LLM to provide the correct input.

    ### Note

    - Provide a concise and precise description for the script. This will be utilized by the LLM to understand it should use this script for capturing a snapshot or recording a video from a camera.
    - Make sure to expose camera entities to Assist.
    - Make sure to expose the script to Assist after the script has been saved.
    - Do not alter the default script name.
    - Once the script is created, click the three dots in the top right corner, choose "Edit in YAML," and remove the `description: ...` line to restore the default. This step is important because it helps the LLM better understand the script's purpose.
  domain: script
  homeassistant:
    min_version: 2024.12.0
  input:
    entity_aliases_settings:
      name: Settings for Entity Aliases
      icon: mdi:format-list-bulleted
      description: You can use these settings to configure a template sensor that stores all information about entity aliases.
      input:
        entity_aliases:
          name: Entity Aliases
          selector:
            entity:
              filter:
                - domain: sensor
                  integration: template
    snapshot_settings:
      name: Settings for Snapshot Output
      icon: mdi:folder-image
      description: Configure where camera captures should be stored and how snapshot filenames are generated.
      collapsed: true
      input:
        snapshot_directory:
          name: Snapshot Directory
          description: Absolute path where the snapshot will be stored (default is `/media`).
          selector:
            text:
          default: /media
        snapshot_filename_prefix:
          name: Snapshot Filename Prefix
          description: Prefix used when generating the snapshot filename.
          selector:
            text:
          default: camera_snapshot_
        snapshot_file_extension:
          name: Snapshot File Extension
          description: File extension to use for the snapshot (for example jpg or png).
          selector:
            text:
          default: jpg
    prompt_settings:
      name: Prompt settings for the LLM
      icon: mdi:robot
      description: You can use these settings to finetune the prompts for your specific LLM (model). In most cases the defaults should be fine.
      collapsed: true
      input:
        camera_name_prompt:
          name: Camera Name Prompt
          description: The friendly name of the camera to capture from, provided by the AI
          selector:
            text:
              multiline: true
          default: |-
            Camera name. Multiple cameras = multiple calls
        capture_type_prompt:
          name: Capture Type Prompt
          description: Whether to capture a snapshot or record a video
          selector:
            text:
              multiline: true
          default: |-
            snapshot or record. Default: snapshot
mode: parallel
max_exceeded: silent
description: Captures a camera snapshot or records a video and returns the local file path
variables:
  version: 20260818
fields:
  camera_name:
    name: Camera Name
    description: !input camera_name_prompt
    selector:
      text:
    required: true
  capture_type:
    name: Capture Type
    description: Select whether to capture a snapshot or record a video.
    selector:
      select:
        options:
          - snapshot
          - record
    default: snapshot
  duration:
    name: Recording Duration
    description: Recording duration in seconds. Only used when capture type is record.
    selector:
      number:
        min: 1
        max: 60
        step: 1
    default: 10
sequence:
  - variables:
      entity_aliases: !input entity_aliases
      camera_name: "{{ camera_name | default('') | trim }}"
      capture_type: "{{ capture_type | default('snapshot', true) | trim | lower }}"
      duration: "{{ duration | default(10, true) | int(10) }}"
      snapshot_directory_input: !input snapshot_directory
      snapshot_directory: "{{ snapshot_directory_input | default('/media', true) | trim }}"
      snapshot_prefix_input: !input snapshot_filename_prefix
      snapshot_prefix: "{{ snapshot_prefix_input | default('camera_snapshot_', true) | trim }}"
      snapshot_extension_input: !input snapshot_file_extension
      snapshot_extension: "{{ snapshot_extension_input | default('jpg', true) | trim | lower }}"
  - alias: Validate camera name
    if:
      - condition: template
        value_template: >-
          {% set friendly_match = states.camera | selectattr('attributes.friendly_name', 'eq', camera_name) | list %}
          {% set alias_match = state_attr(entity_aliases, 'entities') | default([], true) | selectattr('entity_id', 'defined') | selectattr('entity_id', 'match', '^camera\.') | selectattr('aliases', 'defined') | selectattr('aliases', 'contains', camera_name) | list %}
          {{ not camera_name or (friendly_match | length == 0 and alias_match | length == 0) }}
    then:
      - alias: Set variable for error message
        variables:
          response:
            error: Unable to capture a snapshot because the camera name is invalid.
      - alias: Stop the script
        stop: Unable to capture a snapshot because the camera name is invalid.
        response_variable: response
  - alias: Validate capture settings
    if:
      - condition: template
        value_template: >-
          {{ capture_type not in ['snapshot', 'record'] or duration < 1 or duration > 60 }}
    then:
      - alias: Set variable for error message
        variables:
          response:
            error: Capture type must be snapshot or record, and recording duration must be between 1 and 60 seconds.
      - alias: Stop the script
        stop: Capture type must be snapshot or record, and recording duration must be between 1 and 60 seconds.
        response_variable: response
  - alias: Validate snapshot settings
    if:
      - condition: template
        value_template: >-
          {{ not snapshot_directory }}
    then:
      - alias: Set variable for error message
        variables:
          response:
            error: Unable to capture a snapshot because the snapshot directory is missing.
      - alias: Stop the script
        stop: Unable to capture a snapshot because the snapshot directory is missing.
        response_variable: response
  - variables:
      camera_entity_id: >-
        {%- set friendly_matches = states.camera | selectattr('attributes.friendly_name', 'eq', camera_name) | map(attribute='entity_id') | list -%}
        {%- set alias_matches = state_attr(entity_aliases, 'entities') | default([], true) | selectattr('entity_id', 'defined') | selectattr('entity_id', 'match', '^camera\.') | selectattr('aliases', 'defined') | selectattr('aliases', 'contains', camera_name) | map(attribute='entity_id') | list -%}
        {{- friendly_matches[0] if friendly_matches else (alias_matches[0] if alias_matches else '') -}}
      sanitized_prefix: >-
        {% if snapshot_prefix %}
          {{ snapshot_prefix | regex_replace('[^0-9A-Za-z_-]', '_') }}
        {% else %}
          camera_snapshot_
        {% endif %}
      sanitized_extension: >-
        {% if snapshot_extension %}
          {% set ext = snapshot_extension | regex_replace('[^0-9a-z]', '') %}
          {{ '.' ~ (ext if ext else 'jpg') }}
        {% else %}
          .jpg
        {% endif %}
      snapshot_directory_normalized: >-
        {{ snapshot_directory.rstrip('/\\') or '/' }}
      snapshot_random_suffix: "{{ '%05d' | format(range(0, 100000) | random) }}"
      capture_prefix: >-
        {% if capture_type == 'record' %}
          camera_record_
        {% else %}
          {{ sanitized_prefix }}
        {% endif %}
      capture_extension: >-
        {% if capture_type == 'record' %}
          .mp4
        {% else %}
          {{ sanitized_extension }}
        {% endif %}
      capture_filename: >-
        {{ (capture_prefix | trim) ~ now().strftime('%Y%m%d%H%M%S%f') ~ '_' ~ snapshot_random_suffix ~ (capture_extension | trim) }}
      capture_full_path: "{{ ('/' ~ capture_filename) if snapshot_directory_normalized == '/' else (snapshot_directory_normalized ~ '/' ~ capture_filename) }}"
      returned_media_path: >-
        {% set prefix = '/media/' %}
        {% if capture_full_path.startswith(prefix) %}
          {{ 'local/' ~ capture_full_path[prefix | length:] }}
        {% else %}
          {{ capture_full_path }}
        {% endif %}
  - alias: Validate resolved camera entity
    if:
      - condition: template
        value_template: >-
          {{ not camera_entity_id or camera_entity_id not in (states.camera | map(attribute='entity_id') | list) }}
    then:
      - stop: >-
          No active camera entity was found for "{{ camera_name }}".
          Add the camera to the entity aliases sensor or use its exact friendly name.
        error: true
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ capture_type == 'snapshot' }}"
        sequence:
          - action: camera.snapshot
            target:
              entity_id: "{{ camera_entity_id }}"
            data:
              filename: "{{ capture_full_path }}"
          - variables:
              response:
                image_path: "{{ returned_media_path }}"
                media_type: image
      - conditions:
          - condition: template
            value_template: "{{ capture_type == 'record' }}"
        sequence:
          - action: camera.record
            target:
              entity_id: "{{ camera_entity_id }}"
            data:
              filename: "{{ capture_full_path }}"
              duration: "{{ duration }}"
          - variables:
              response:
                video_path: "{{ returned_media_path }}"
                media_type: video
    default:
      - variables:
          response:
            error: "Unsupported capture type: {{ capture_type }}"
  - stop: ""
    response_variable: response
