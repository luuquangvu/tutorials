[project]
name = "tutorials"
version = "1.0.0"
description = "Exclusive Home Assistant Blueprints: Voice & Smart Automations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "beautifulsoup4",
  "curl-cffi",
  "google-api-python-client",
  "homeassistant",
  "httpx[http2]",
  "interrogate",
  "prek",
  "ruff",
  "ty",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "LOG", # flake8-logging
  "N",   # pep8-naming
  "PIE", # flake8-pie
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "RUF", # ruff-specific rules
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.interrogate]
fail-under = 100
