blueprint:
  name: Send to Zalo
  author: luuquangvu
  source_url: https://github.com/luuquangvu/tutorials/blob/main/send_to_zalo_bot_full_llm.yaml
  description: |-
    # Tool for sending content to Zalo used for Voice Assistant

    ## Blueprint Setup

    ### Required

    - Create a Zalo bot if it does not already exist using OA Zalo Bot Manager.
    - The Pyscript integration needs to be installed through HACS and properly configured.
    - The `scripts/zalo_bot_handle_tool.py` script needs to be copied into the `config/pyscript` folder.
    - The `scripts/requirements.txt` file needs to be copied into the `config/pyscript` folder.
    - The mentioned file(s) is/are included in the repository.
    - You need to enable two Pyscript options through the UI or via YAML to allow importing all Python packages and to make hass available as a global variable.
    - A Zalo bot token needs to be configured in `config/configuration.yaml` and `config/secrets.yaml`.

    ```
    # File configuration.yaml
    pyscript:
      allow_all_imports: true
      hass_is_global: true
      zalo_bot_token: !secret zalo_bot_token
    ```

    ```
    # File secrets.yaml
    zalo_bot_token: XXXXXX      # Retrieve the token from the OA Zalo Bot Manager.
    ```

    ### Optional

    - Using this custom script as an additional tool, along with the Zalo Bot Webhook blueprint, enables smooth two-way communication between the Zalo bot and Home Assistant.
    - Adjust the prompts for each field used in the script. The descriptions guide the LLM to provide the correct input.

    ### Note

    - Provide a concise and precise description for the script. This will be utilized by the LLM to understand it should use this script for sending user requested content to Zalo.
    - Make sure to expose the script to Assist after the script has been saved.
    - Do not alter the default script name.
    - Once the script is created, click the three dots in the top right corner, choose "Edit in YAML," and remove the `description: ...` line to restore the default. This step is important because it helps the LLM better understand the script's purpose.
  domain: script
  homeassistant:
    min_version: 2024.12.0
  input:
    zalo_settings:
      name: Settings for Zalo
      icon: mdi:alpha-z-circle-outline
      description: Use these settings to configure Zalo for sending text or supported media.
      input:
        chat_id:
          name: Chat ID
          description: The chat ID to send the message to.
          selector:
            text:
    prompt_settings:
      name: Prompt settings for the LLM
      icon: mdi:robot
      description: You can use these settings to finetune the prompts for your specific LLM (model). In most cases the defaults should be fine.
      collapsed: true
      input:
        summary_prompt:
          name: Summary Prompt
          description: A brief overview or caption for Zalo text or images; not used for stickers or voice messages
          selector:
            text:
              multiline: true
          default: |-
            <=10 words overview/caption. Plain text. Multiple items = multiple calls
        detail_prompt:
          name: Detail Prompt
          description: Additional supporting details for the Zalo message/image
          selector:
            text:
              multiline: true
          default: |-
            Full details. No links/markdown/emojis. Multiple items = multiple calls
        content_type_prompt:
          name: Content Type Prompt
          description: Instructions for choosing the Zalo content type
          selector:
            text:
              multiline: true
          default: |-
            Choose the most appropriate type: information for text, image for an image, sticker for a Zalo sticker ID, or voice for a public HTTPS AAC voice URL. Voice messages support one-to-one chats only and have no caption. Multiple items = multiple calls
        image_path_prompt:
          name: Image Path Prompt
          description: Prompt shown to the LLM to request the media path when sending an image.
          selector:
            text:
              multiline: true
          default: |-
            Existing path (local/, /media/). No guessing
        sticker_prompt:
          name: Sticker ID Prompt
          description: Prompt shown to the LLM to request the Zalo sticker ID when sending a sticker.
          selector:
            text:
              multiline: true
          default: |-
            Existing Zalo sticker ID from stickers.zaloapp.com. No guessing
        voice_url_prompt:
          name: Voice URL Prompt
          description: Prompt shown to the LLM to request the public AAC URL when sending a voice message.
          selector:
            text:
              multiline: true
          default: |-
            Public HTTPS URL ending in .aac. One-to-one Zalo chats only. No guessing
        chat_id_override_prompt:
          name: Chat ID Override Prompt
          description: An alternate Zalo Chat ID specified by the user
          selector:
            text:
              multiline: true
          default: |-
            Alternate Zalo ID
mode: queued
max: 30
max_exceeded: silent
description: Sends messages, images, stickers, or AAC voice messages via Zalo
variables:
  version: 20260818
fields:
  summary:
    name: Summary
    description: !input summary_prompt
    selector:
      text:
  detail:
    name: Detail
    description: !input detail_prompt
    selector:
      text:
  content_type:
    name: Content Type
    description: !input content_type_prompt
    selector:
      select:
        options:
          - information
          - image
          - sticker
          - voice
    required: true
  image_path:
    name: Image Path
    description: !input image_path_prompt
    selector:
      text:
  sticker:
    name: Sticker ID
    description: !input sticker_prompt
    selector:
      text:
  voice_url:
    name: Voice URL
    description: !input voice_url_prompt
    selector:
      text:
  target_chat_id:
    name: Override Chat ID
    description: !input chat_id_override_prompt
    selector:
      text:
sequence:
  - variables:
      default_chat_id: !input chat_id
      summary: "{{ summary | default('') | trim }}"
      detail: "{{ detail | default('') | trim }}"
      content_type: "{{ content_type | default('') | trim }}"
      image_path: "{{ image_path | default('', true) | trim }}"
      sticker: "{{ sticker | default('', true) | trim }}"
      voice_url: "{{ voice_url | default('', true) | trim }}"
      override_chat_id: "{{ target_chat_id | default('') | trim }}"
      chat_id_value: >-
        {% set candidate = override_chat_id if override_chat_id else default_chat_id %}
        {{ '' if candidate is none else (candidate | string | trim) }}
  - alias: Check if variables were set correctly
    if:
      - condition: template
        value_template: >-
          {{
            (content_type not in ['information', 'image', 'sticker', 'voice'])
            or (not chat_id_value)
            or (content_type in ['information', 'image'] and not summary)
            or (content_type == 'image' and not image_path)
            or (content_type == 'sticker' and not sticker)
            or (content_type == 'voice' and not voice_url)
          }}
    then:
      - alias: Set variable for error message
        variables:
          response:
            error: >-
              Unable to send the message to Zalo because one or more inputs are missing or invalid (summary, content_type, chat_id, image_path, sticker, or voice_url).
      - alias: Stop the script
        stop: Unable to send the message to Zalo due to invalid inputs.
        response_variable: response
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ content_type == 'information' }}"
        sequence:
          - action: pyscript.send_zalo_message
            data:
              chat_id: "{{ chat_id_value }}"
              message: |-
                {{ summary }}{% if detail %}

                {{ detail }}{% endif %}
            response_variable: zalo_response
      - conditions:
          - condition: template
            value_template: "{{ content_type == 'image' }}"
        sequence:
          - action: pyscript.send_zalo_photo
            data:
              chat_id: "{{ chat_id_value }}"
              file_path: "{{ image_path }}"
              caption: |-
                {{ summary }}{% if detail %}

                {{ detail }}{% endif %}
            response_variable: zalo_response
      - conditions:
          - condition: template
            value_template: "{{ content_type == 'sticker' }}"
        sequence:
          - action: pyscript.send_zalo_sticker
            data:
              chat_id: "{{ chat_id_value }}"
              sticker: "{{ sticker }}"
            response_variable: zalo_response
      - conditions:
          - condition: template
            value_template: "{{ content_type == 'voice' }}"
        sequence:
          - action: pyscript.send_zalo_voice
            data:
              chat_id: "{{ chat_id_value }}"
              voice_url: "{{ voice_url }}"
            response_variable: zalo_response
  - stop: ""
    response_variable: zalo_response
